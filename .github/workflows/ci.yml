name: CI

# The test suite stands in for the `container` CLI with a fake, so none of
# this needs a container daemon — which is what makes CI possible at all.
#
# Started by hand only (Actions tab, or `gh workflow run ci.yml`) so pushes do
# not spend runner minutes. `scripts/check.sh` runs the same checks locally.
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the only platform zcontainer targets, since Apple's
        # `container` runs nowhere else. Linux is built anyway: it costs one
        # runner and catches accidental reliance on Darwin-only APIs early.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check formatting
        run: zig fmt --check build.zig src test

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Check the binaries answer for themselves
        run: |
          ./zig-out/bin/zcontainer --version
          ./zig-out/bin/zcontainer-web --version

      - name: Working tree is left clean
        # The fake's invocation log goes to a temporary directory, so nothing
        # the tests write should ever reach the repository.
        #
        # Compared as a string rather than piped through `wc -l`: BSD wc pads
        # its count with spaces, so the obvious `wc -l | grep -qx 0` passes on
        # Linux and fails on macOS for a perfectly clean tree.
        run: |
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "the run left the working tree dirty:"
            echo "$dirty"
            exit 1
          fi
